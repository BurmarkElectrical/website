<form action="{{ form.action }}{{ form.action_hash }}" class="form contact_form" method="POST">

    {% include "form/hidden_inputs.html" %}
    
    <span class='form-input'>
        <label for="name">name</label>
        <input name='name' placeholder='name' type='text'>
        <input name='last_name' placeholder='last name' type='text'>
    </span>

    <span class='form-input'>
        <label for="email">email</label>
        <input name='email' placeholder='email' type='email' required>
    </span>

    <span class='form-input'>
        <label for="message">message</label>
        <textarea placeholder="message" name="message" rows="{{form.rows}}" required></textarea>
    </span>

    <button class="submit" type="submit">{{form.submit_text}}</button>

</form>

<script>
  document.querySelector('.contact_form').addEventListener('submit', function () {
    var hp = document.querySelector('.contact_form input[name="last_name"]');
    if (hp) hp.name = '_honey';
  });
</script>
